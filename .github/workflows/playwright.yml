name: Accessibility tests (Playwright + Evinced)

# Manual trigger only for now. Once the three secrets below are added under
# Settings > Secrets and variables > Actions, uncomment the push / pull_request
# triggers so every change is checked automatically.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Auth for the private @evinced scope on JFrog.
      # Add JFROG_AUTH_TOKEN in repo Settings > Secrets and variables > Actions.
      - name: Install dependencies
        run: npm ci
        env:
          JFROG_AUTH_TOKEN: ${{ secrets.JFROG_AUTH_TOKEN }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility suite
        run: npm test
        env:
          EVINCED_SERVICE_ID: ${{ secrets.EVINCED_SERVICE_ID }}
          EVINCED_API_KEY: ${{ secrets.EVINCED_API_KEY }}

      - name: Upload Evinced report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evinced-report
          path: evincedReports/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
